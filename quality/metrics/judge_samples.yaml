llm_quality:
  - id: excellent
    note: all criteria high -> fluent, coherent, on-topic, specific
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Utilities now balance intermittent solar and wind output with grid-scale
      batteries and demand-response programs, while operators redesign transmission
      networks to carry electricity from sunny deserts and windy coasts to distant
      cities. The shift is also reshaping wholesale markets, where prices dip toward
      zero during the midday generation peak and spike after sunset.

  - id: disfluent
    note: fluency LOW (grammar/spelling), but on-topic and substantive
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Renewable energys is growing very fast and many countrys builds solar farm and
      wind turbine for make the electricity more cheaper, the grid it must to change
      alot because the sun and the wind they not always is blowing so the battery is
      needed for store the power when the demand are being high.

  - id: incoherent
    note: coherence LOW (non sequiturs, unfinished), sentences individually fluent
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Solar power is now the cheapest source of electricity in human history. Grid
      operators value wind for its perfect predictability. Anyway, the price of
      copper. The committee met on Tuesday. Therefore the moon, and so

  - id: contradictory_facts
    note: coherence LOW via direct SELF-contradiction, otherwise fluent/relevant/specific
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Germany now generates more than half of its electricity from renewable sources,
      a remarkable milestone for a major industrial economy. In fact, Germany still
      draws the overwhelming majority of its power from coal and has made essentially
      no progress on renewables at all. Either way, its grid is widely studied abroad.

  - id: off_topic
    note: relevance LOW (drifts entirely off the prompt), otherwise fluent and coherent
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      My grandmother baked the most wonderful sourdough bread every Sunday morning.
