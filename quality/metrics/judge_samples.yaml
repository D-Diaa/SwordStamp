  - id: short_complete
    note: all-high despite being SHORT (length is not quality)
    prompt: |-
      Define entropy in one sentence.
    gen: |-
      Entropy is a measure of the number of microscopic configurations consistent
      with a system's macroscopic state, and hence of its disorder and of our
      uncertainty about its exact arrangement.

  - id: long_rambling
    note: relevance + informativeness LOW despite LENGTH (length is not quality)
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      The transition to renewable energy is reshaping global power grids, and that is
      a very interesting thing to think about, really. You know, energy has always
      mattered to people, ever since someone first discovered fire, and fire is
      fascinating in its own right because it cooks our food and keeps us warm.
      Speaking of warmth, the summers do seem hotter lately, which makes me think of
      the beach, and beaches have sand, and sand is used to make the silicon in solar
      panels, so really it all connects in the end when you sit and think about it.

  - id: verbose_but_informative
    note: all-high AND long+dense (length must NOT be penalized when content is rich)
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      The shift to renewables forces grid operators to manage two new problems at once:
      variability and decentralization. Solar and wind output swings with the weather,
      so utilities pair them with lithium-ion batteries, pumped-hydro reservoirs, and
      demand-response contracts that pay factories to curtail load during shortfalls.
      At the same time, rooftop panels turn millions of consumers into producers,
      reversing power flows that substations were never designed to handle. In response,
      operators are deploying smart inverters, dynamic line ratings, and wholesale
      markets that settle every five minutes to keep supply and demand matched.

  - id: factually_wrong_but_fluent
    note: SCOPE probe - factually FALSE but fluent/coherent/on-topic/specific; quality
      has no factuality criterion, so it should stay HIGH. A low score = judge overreach.
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Solar panels generate the most electricity at night, when the cooler air lets
      their silicon cells run at peak efficiency, so grid operators schedule the
      heaviest industrial loads for the small hours of the morning to soak up this
      abundant after-dark supply before demand falls again at sunrise.

  - id: mid_acceptable
    note: genuinely MIDDLING ~3 - comma splices, filler, generic, thin on specifics
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Renewable energy, it is changing the power grid in lots of ways that are
