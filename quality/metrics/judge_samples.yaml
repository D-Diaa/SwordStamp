      and relax in our spare time.

  - id: vague_padding
    note: informativeness LOW (vague filler, no specifics), otherwise fine
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Renewable energy is a very important topic in today's world. There are many
      things to consider, and it affects many people in many different ways. Overall,
      it is clear that this is a significant issue that will continue to be
      significant going forward, so we should all think carefully about it.

  - id: repetitive
    note: informativeness ZERO (restates one idea), drags coherence too
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Solar energy is clean. Solar energy is clean and good. Solar energy, which is
      clean, is a clean form of energy. Because it is clean, solar energy is a clean
      and clean source of clean energy.

  - id: list_fragment
    note: informativeness HIGH but fluency + coherence LOW (telegraphic fragments)
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Renewable. Grids changing. Solar, wind - intermittent. Batteries: storage.
      Transmission upgrades needed. Markets shifting. Prices volatile midday. Demand
