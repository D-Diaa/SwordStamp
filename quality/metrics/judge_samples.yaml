  - id: partially_relevant
    note: relevance MID (~2-3) - starts on-topic then drifts halfway through
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Renewable energy is changing how grids are managed, with operators adding storage
      to smooth out variable output. This really reminds me of how much technology has
