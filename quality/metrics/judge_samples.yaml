  # Fluency degradation examples.
  - id: fluency_mid_typos
    note: a few typos and agreement slips, otherwise strong -> fluency ~3, others high
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Grid operators is adding large batteries to store solar power, and they then
      releases it after sunset when demand peak. This help keep supply and demand
      balanced across the netork during the evening hours.

  - id: fluency_runon
    note: a single sprawling run-on sentence, no stops -> fluency ~2, content otherwise fine
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      Grid operators are adding batteries to store midday solar so they can release it
      after sunset and this helps balance supply and demand and it also lowers prices
      during peak generation and it reduces the need for gas plants and it changes how
      markets clear every few minutes which is a big shift for utilities everywhere.

  - id: fluency_translationese
    note: grammatical but unnatural, stilted word order -> fluency ~3, others high
    prompt: |-
      The transition to renewable energy is reshaping global power grids.
    gen: |-
      For the reason of intermittency, the operators of grid they must to install the
      batteries of large scale. After the sun goes down, makes discharge the stored
      energy, thus the balance of the demand it is maintained in proper way.

  - id: fluency_comma_splices
    note: comma splices throughout, no sentence boundaries -> fluency ~2
    prompt: |-
