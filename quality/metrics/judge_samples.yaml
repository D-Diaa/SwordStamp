  # Information-injection examples.
  - id: injection_opinion
    note: adds an evaluative opinion not in the reference -> information_injection ~3, content_recall 5, contradiction 0
    ref: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall and was designed by
      Gustave Eiffel's engineering company.
    gen: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall and was designed by
      Gustave Eiffel's engineering company - surely the most beautiful structure ever built.

  - id: injection_inference
    note: adds a plausible inference the reference does not state -> information_injection ~2
    ref: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall and was designed by
      Gustave Eiffel's engineering company.
    gen: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall and was designed by
      Gustave Eiffel's engineering company, so its construction must have taken several years.

  - id: injection_elaboration
    note: elaborates a kept point with invented specifics -> information_injection ~3-4
    ref: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall and was designed by
      Gustave Eiffel's engineering company.
    gen: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall and was designed by
      Gustave Eiffel's engineering company, which employed 250 workers and used 18,000
      iron pieces fastened by hand.

  - id: injection_single_fact
    note: adds one fabricated statistic, nothing else -> information_injection ~2
    ref: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall and was designed by
      Gustave Eiffel's engineering company.
    gen: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall, draws 50 million
      visitors a year, and was designed by Gustave Eiffel's engineering company.

  - id: injection_tangent
    note: appends a whole unrelated tangent -> information_injection ~5, content_recall 5
    ref: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall and was designed by
      Gustave Eiffel's engineering company.
    gen: |-
      The Eiffel Tower, completed in 1889, stands 330 metres tall and was designed by
      Gustave Eiffel's engineering company. Paris is also famous for its cafes, where
      buttery croissants and strong espresso are a morning ritual for many residents.

  # Contradiction examples.
  - id: contradiction_partial
    note: reverses one of four claims (net income fell), keeps the rest -> contradiction ~2-3, content_recall 5
    ref: |-
      Tesla reported Q3 2024 revenue of $25.2 billion, up 7.8% year over year, with net
      income of $2.3 billion driven by strong Model Y sales in Europe.
    gen: |-
      Tesla reported Q3 2024 revenue of $25.2 billion, up 7.8% year over year, though
      net income fell sharply despite strong Model Y sales in Europe.

  - id: contradiction_negation
    note: negates the central claim -> contradiction 5, content_recall high
    ref: |-
      A large clinical trial found that the new vaccine reduced severe illness in
      elderly patients.
    gen: |-
      A large clinical trial found that the new vaccine did not reduce severe illness
      in elderly patients.

  - id: contradiction_direction
    note: reverses the direction of both trends at the claim level -> contradiction 5
    ref: |-
      Between 2010 and 2020 the city's population rose by 15 percent and its average
      rent doubled.
    gen: |-
      Between 2010 and 2020 the city's population fell by 15 percent and its average
      rent was cut in half.

  - id: contradiction_causal
    note: reverses the causal direction -> contradiction ~4, content_recall high
    ref: |-
      Heavy rainfall in April caused the river to flood, which forced hundreds of
      residents to evacuate.
    gen: |-
      The river flooding in April caused the heavy rainfall, which forced hundreds of
      residents to evacuate.

  - id: contradiction_scope
    note: overgeneralizes the scope (some -> all) -> contradiction ~3, content_recall high
    ref: |-
      Some economists supported the central bank's decision to raise interest rates.
    gen: |-
      Every economist supported the central bank's decision to raise interest rates.

  - id: empty
    note: empty candidate -> every criterion 0 (short-circuits before the LLM)
    ref: |-
      Photosynthesis converts carbon dioxide and water into glucose and oxygen using
      light energy captured by chlorophyll in plant cells.
    gen: ""
